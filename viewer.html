<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoxPoly Studio · FBX Viewer</title><link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#15131c;--panel:#1d1a26;--line:#ffffff1f;--text:#eee9e1;--muted:#bdb6ad;--gold:#f0c874;--acc:#7fd0ff;--warn:#ffb454}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:grid;grid-template-columns:260px 1fr 300px;grid-template-rows:1fr 190px;background:var(--bg);color:var(--text);font-family:'Chakra Petch',Tahoma,sans-serif;overflow:hidden}
aside{background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow:auto;grid-row:1 / 3}
#right{border-right:0;border-left:1px solid var(--line);grid-column:3}
h1{font-size:15px;letter-spacing:2px;margin:0 0 2px;color:var(--gold)}
.sub{font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.5}
h2{font-size:12px;letter-spacing:1.5px;color:var(--muted);margin:16px 0 6px;font-weight:600}
.list{display:flex;flex-direction:column;gap:4px}
button{font:600 13px 'Chakra Petch',Tahoma;color:var(--text);background:#2a2533;border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer;text-align:left}
button:hover{border-color:#f0c87488}
button[aria-pressed=true]{background:#3a2f1c;border-color:var(--gold);color:#ffe3ab}
button small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row button{text-align:center;flex:1;padding:7px 6px}
#stage{position:relative;overflow:hidden;grid-column:2;grid-row:1}
#stage canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:12px;top:10px;font-size:13px;color:var(--muted);pointer-events:none;line-height:1.7;text-shadow:0 1px 2px #000}
#hud b{color:var(--text)}
#bottom{grid-column:2;grid-row:2;border-top:1px solid var(--line);background:#120f18;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
#transport{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
#transport button{padding:5px 10px}
#scrub{flex:1;accent-color:var(--gold)}
#graph{flex:1;width:100%;min-height:0;background:#0e0c12;border-radius:6px}
input[type=search]{width:100%;font:500 12px 'Chakra Petch',Tahoma;background:#120f18;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
#bones{max-height:46vh;overflow:auto;font-size:12px}
#bones div{padding:3px 6px;border-radius:4px;cursor:pointer;color:var(--muted);white-space:nowrap}
#bones div:hover{background:#2a2533;color:var(--text)}
#bones div.on{background:#3a2f1c;color:#ffe3ab}
#cueList{font-size:12px;color:var(--muted)}
#cueList div{display:flex;gap:8px;padding:2px 0}
#cueList b{color:var(--gold);min-width:42px;font-variant-numeric:tabular-nums}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}
code{font-size:11px;background:#0e0c12;padding:1px 4px;border-radius:3px}
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head><body>
<aside>
  <h1>FBX VIEWER</h1><div class="sub" data-i18n="vw.sub"></div>
  <h2 data-i18n="vw.files">Files</h2>
  <div class="list" id="files"></div>
  <h2 data-i18n="vw.clips">Clips</h2>
  <div class="list" id="clips"></div>
  <h2 data-i18n="vw.display">Display</h2>
  <div class="row"><button id="skel" aria-pressed="true" data-i18n="vw.skel">Skeleton</button><button id="mesh" aria-pressed="true" data-i18n="vw.mesh">Mesh</button><button id="ground" aria-pressed="true" data-i18n="vw.ground">Ground</button></div>
  <div class="note" data-i18n="vw.help"></div>
</aside>
<main id="stage"><canvas id="c"></canvas><div id="hud"></div></main>
<section id="bottom">
  <div id="transport">
    <button id="play">▶</button><button id="slow" aria-pressed="false">×0.25</button><button id="loop" aria-pressed="true" data-i18n="vw.loop">Loop</button>
    <input id="scrub" type="range" min="0" max="1000" value="0"><span id="time">0.00 s</span>
    <button id="tick" aria-pressed="false" data-i18n="vw.tick">Tick on cues</button>
  </div>
  <canvas id="graph"></canvas>
</section>
<aside id="right">
  <h2 data-i18n="vw.bones">Bones</h2>
  <input id="filter" type="search" placeholder="filter…">
  <div id="bones"></div>
  <div class="note" id="boneInfo"></div>
  <h2 data-i18n="vw.cues">Sound cues</h2>
  <div id="cueList"></div>
</aside>
<script type="module" src="viewer.js"></script>
<script type="module" src="nav.js"></script>
</body></html>
